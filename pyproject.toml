[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "retailpulse"
version = "1.0.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]
[project.scripts]
retailpulse = "retailpulse.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools]
packages = ["retailpulse", "retailpulse.dashboard", "retailpulse.dashboard.pages"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly configured disposable PostgreSQL database"]
